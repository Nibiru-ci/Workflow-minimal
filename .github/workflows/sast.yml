name: SAST

# Static Application Security Testing : analyse statique du code avec Codacy Analysis CLI.

on:
  workflow_call:
    inputs:
      max-allowed-issues:
        description: "Nombre maximal d'issues tolérées avant échec"
        type: number
        default: 0
    secrets:
      CODACY_PROJECT_TOKEN:
        description: "Token projet Codacy (optionnel) : configuration distante + envoi des résultats au dashboard"
        required: false

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Codacy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Les secrets ne sont pas disponibles pour les PR issues de forks : on bascule alors
      # sur la configuration Codacy par défaut, sans envoi vers le dashboard.
      - name: Vérifier la présence du token Codacy
        id: token
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CODACY_PROJECT_TOKEN absent : configuration Codacy par défaut, résultats non envoyés au dashboard."
          fi

      - name: Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          upload: ${{ steps.token.outputs.present }}
          format: sarif
          output: codacy-results.sarif
          max-allowed-issues: ${{ inputs.max-allowed-issues }}
          gh-code-scanning-compat: true

      - name: Résumé du scan
        if: always()
        run: |
          {
            echo "## SAST - Codacy"
            if [ -s codacy-results.sarif ]; then
              count=$(jq '[.runs[].results[]?] | length' codacy-results.sarif)
              echo "**${count} issue(s)** détectée(s) (seuil toléré : ${{ inputs.max-allowed-issues }})."
              echo
              echo "Répartition par niveau : $(jq -r '[.runs[].results[]?] | group_by(.level // "n/a") | map("\(.[0].level // "n/a") : \(length)") | join(", ")' codacy-results.sarif)"
              echo
              echo "| Règle | Niveau | Fichier | Ligne |"
              echo "|---|---|---|---|"
              jq -r '[.runs[].results[]?] | .[:300][] | "| \(.ruleId) | \(.level // "n/a") | \(.locations[0].physicalLocation.artifactLocation.uri // "n/a") | \(.locations[0].physicalLocation.region.startLine // "n/a") |"' codacy-results.sarif
              if [ "$count" -gt 300 ]; then echo; echo "_Affichage limité aux 300 premières issues, voir l'artifact pour le détail._"; fi
            else
              echo "Aucun rapport produit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sast-codacy-report
          path: codacy-results.sarif
          if-no-files-found: ignore
