name: Secret scanning

# Détection de secrets dans le code et l'historique git avec Gitleaks.
# Les valeurs détectées sont intégralement masquées (--redact=100) : elles n'apparaissent ni dans les logs, ni dans les rapports.

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    name: Secret scanning - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Gitleaks (checksum vérifié)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          rm "$archive"

      - name: Scanner l'historique
        run: |
          ./gitleaks git . \
            --config .gitleaks.toml \
            --redact=100 \
            --no-banner \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Résumé du scan
        if: always()
        run: |
          {
            echo "## Secret scanning (Gitleaks)"
            if [ -s gitleaks-report.json ] && [ "$(jq length gitleaks-report.json)" -gt 0 ]; then
              echo "**$(jq length gitleaks-report.json) secret(s) potentiel(s)** détecté(s). Les valeurs sont masquées."
              echo
              echo "| Règle | Fichier | Ligne | Commit |"
              echo "|---|---|---|---|"
              jq -r '.[:100][] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[:8]) |"' gitleaks-report.json
              echo
              echo "Révoquer/renouveler le secret exposé, puis nettoyer l'historique si nécessaire."
            else
              echo "Aucun secret détecté."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport (masqué)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
