name: SCA

# Software Composition Analysis : dépendances applicatives (lockfiles) et images conteneur (Trivy).
# Tous les Dockerfile du dépôt sont découverts automatiquement : chacun est construit (sans push) puis scanné.

on:
  workflow_call:
    inputs:
      severity:
        description: "Sévérités qui font échouer le scan"
        type: string
        default: "HIGH,CRITICAL"

permissions:
  contents: read

jobs:
  sca-dependencies:
    name: SCA - Dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy - scan des dépendances
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-dependencies.txt
          hide-progress: true

      - name: Résumé du scan
        if: always()
        run: |
          {
            echo "## SCA - Dépendances (Trivy)"
            if [ -s trivy-dependencies.txt ]; then
              echo '```'
              head -c 500000 trivy-dependencies.txt
              echo '```'
            else
              echo "Aucune vulnérabilité ${{ inputs.severity }} (avec correctif disponible) détectée."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-dependencies-report
          path: trivy-dependencies.txt
          if-no-files-found: ignore

  discover-images:
    name: SCA - Découverte des Dockerfile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      found: ${{ steps.find.outputs.found }}
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rechercher les Dockerfile
        id: find
        run: |
          matrix=$(find . -type f \( -name 'Dockerfile' -o -name 'Dockerfile.*' -o -name '*.Dockerfile' \) \
              -not -path './.git/*' -not -path '*/node_modules/*' \
            | sed 's|^\./||' | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | to_entries | map({
                index: .key,
                dockerfile: .value,
                context: (.value | split("/") | .[:-1] | join("/") | if . == "" then "." else . end),
                slug: (.value | gsub("[^A-Za-z0-9]"; "-"))
              })')
          count=$(echo "$matrix" | jq length)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "## SCA - Images conteneur (Trivy)"
            if [ "$count" -gt 0 ]; then
              echo "$count Dockerfile détecté(s) :"
              echo "$matrix" | jq -r '.[] | "- `\(.dockerfile)` (contexte `\(.context)`)"'
            else
              echo "Aucun Dockerfile trouvé : scan d'image ignoré."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sca-image:
    name: SCA - Image (${{ matrix.dockerfile }})
    needs: discover-images
    if: needs.discover-images.outputs.found == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-images.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construire l'image (locale, sans push)
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: docker build -f "$DOCKERFILE" -t "sca-scan:${{ matrix.index }}" "$CONTEXT"

      - name: Trivy - scan de l'image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sca-scan:${{ matrix.index }}
          scanners: vuln
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-image.txt
          hide-progress: true

      - name: Résumé du scan
        if: always()
        run: |
          {
            echo "## SCA - Image \`${{ matrix.dockerfile }}\` (Trivy)"
            if [ -s trivy-image.txt ]; then
              echo '```'
              head -c 500000 trivy-image.txt
              echo '```'
            else
              echo "Aucune vulnérabilité ${{ inputs.severity }} (avec correctif disponible) détectée."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-image-report-${{ matrix.slug }}
          path: trivy-image.txt
          if-no-files-found: ignore
